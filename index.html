<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffd6e7, #ffeef5);
        overflow: hidden;
    }

    .container {
        background: white;
        width: 85%;
        max-width: 500px;
        padding: 40px 25px;
        border-radius: 25px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
        color: #ff4f81;
        font-size: 32px;
    }

    p {
        color: #555;
        font-size: 20px;
    }

    button {
        border: none;
        padding: 14px 28px;
        margin: 10px;
        border-radius: 30px;
        font-size: 18px;
        cursor: pointer;
    }

    #yes {
        background: #ff4f81;
        color: white;
    }

    #no {
        background: #eee;
        color: #555;
    }

    #message {
        display: none;
        font-size: 22px;
        color: #ff4f81;
        margin-top: 20px;
    }

    .heart {
        position: fixed;
        bottom: -20px;
        font-size: 25px;
        animation: float 5s linear infinite;
    }

    @keyframes float {
        from {
            transform: translateY(0);
            opacity: 1;
        }
        to {
            transform: translateY(-100vh);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Hey My Love ❤️</h1>

    <p id="question">
        I have a very important question for you... 🥺
    </p>

    <p>
        Do you love me? 💕
    </p>

    <button id="yes" onclick="yesClicked()">YES ❤️</button>
    <button id="no" onclick="noClicked()">NO 😒</button>

    <div id="message">
        I KNEW IT! 😂❤️<br><br>
        You're stuck with me forever now. 😌💕<br><br>
        I love you so much, my baby! 🥺❤️
    </div>

</div>

<script>

function yesClicked() {
    document.getElementById("message").style.display = "block";
    document.getElementById("question").innerHTML =
        "Awww! That's the answer I wanted! 🥹❤️";

    document.getElementById("yes").style.display = "none";
    document.getElementById("no").style.display = "none";
}

function noClicked() {
    const button = document.getElementById("no");

    button.style.position = "fixed";

    button.style.left =
        Math.random() * (window.innerWidth - 100) + "px";

    button.style.top =
        Math.random() * (window.innerHeight - 60) + "px";
}

function createHeart() {
    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration =
        (3 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 7000);
}

setInterval(createHeart, 500);

</script>

</body>
</html>
