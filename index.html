<!DOCTYPE html>
<html>
<head>
    <title>For My Love ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: pink;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 80%;
            max-width: 600px;
            padding: 50px;
            background: white;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #e75480;
            font-size: 40px;
        }

        p {
            font-size: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🌞 Good Morning, Mero Maya ❤️</h1>

        <p>
            Good morning, my love. 🥰
        </p>

        <p>
            I hope you woke up with a beautiful smile today.
            Even though we are far from each other,
            you are always in my heart. ❤️
        </p>

        <p>
            Take care of yourself and have a beautiful day.
            Someone is missing you very much. 🥺💕
        </p>

    </div>

</body>
</html>
